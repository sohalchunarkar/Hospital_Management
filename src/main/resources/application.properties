spring.application.name=project
server.port=2389
# Database Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate and JPA Properties (Optional but useful)
# 'update' automatically updates the database schema based on your JPA entities
spring.jpa.hibernate.ddl-auto=update
# Specifies the SQL dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Shows generated SQL in the console (useful for development)
spring.jpa.show-sql=true
